<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dBay lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B07400}a:hover{color:#8A5E00}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #191919; font-family: 'Nunito', sans-serif; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" style="font-family: 'Lilita One', sans-serif; font-size: 30px; color: #191919; text-decoration: none"><span style="color: #F04B3E">d</span><span style="color: #2F7CF6">B</span><span style="color: #FFB81C">a</span><span style="color: #8BC53F">y</span></a>
    <span style="font-size: 13px; font-weight: 800; color: #6B7280">LOBBY</span>
  </header>

  <section aria-label="Room code" style="background: #F3F4F6; border: 2px solid #0E1511; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: center">
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 2px; color: #6B7280">ROOM CODE</span>
    <div style="display: flex; gap: 6px">
      <sc-for list="{{codeChars}}" as="c" hint-placeholder-count="5">
        <span style="width: 48px; height: 58px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; color: #1E1A14; border: 2px solid #0E1511; border-radius: 10px; box-shadow: 0 3px 0 #0E1511; font-family: 'Lilita One', sans-serif; font-size: 32px">{{c.ch}}</span>
      </sc-for>
    </div>
    <button type="button" onClick="{{copy}}" style="height: 44px; padding: 0 20px; background: #1E2A44; color: #FFFFFF; border: 2px solid #0E1511; border-radius: 999px; box-shadow: 0 3px 0 #0E1511; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; cursor: pointer">{{copyLabel}}</button>
  </section>

  <section aria-label="Players" style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #6B7280"><span>PLAYERS</span><span>4 / 6</span></div>
    <sc-for list="{{players}}" as="p" hint-placeholder-count="6">
      <div style="height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: #F3F4F6; border: 2px solid #0E1511; border-radius: 12px">
        <span style="{{p.chipStyle}}">{{p.shape}}</span>
        <span style="flex: 1; font-weight: 800; font-size: 16px; color: {{p.nameColor}}">{{p.name}}</span>
        <span style="font-size: 12px; font-weight: 800; color: #6B7280; letter-spacing: 1px">{{p.tag}}</span>
      </div>
    </sc-for>
  </section>

  <section aria-label="Game settings (host only)" style="display: flex; flex-direction: column; gap: 10px; height: 283px">
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 1px; color: #6B7280">SETTINGS · HOST</span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-weight: 800">Mode</span>
      <div role="group" aria-label="Mode" style="display: flex; background: #E5E7EB; border-radius: 999px; padding: 3px">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
          <button type="button" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-weight: 800">Bid window</span>
      <div role="group" aria-label="Bid window" style="display: flex; background: #E5E7EB; border-radius: 999px; padding: 3px">
        <sc-for list="{{windows}}" as="w" hint-placeholder-count="3">
          <button type="button" onClick="{{w.pick}}" style="{{w.style}}">{{w.label}}</button>
        </sc-for>
      </div>
    </div>
    <p style="margin: 0; font-size: 13px; color: #6B7280; font-weight: 700">{{modeHint}}</p>
  </section>

  <a href="Game.dc.html" style="margin-top: auto; height: 60px; display: flex; align-items: center; justify-content: center; background: #1E2A44; color: #FFFFFF; border: 2px solid #0E1511; border-radius: 16px; box-shadow: 0 4px 0 #0E1511; font-family: 'Lilita One', sans-serif; font-size: 26px; text-decoration: none">Start game</a>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'Classic', win: '5s', copied: false }; }
  renderVals() {
    const chip = (bg, fg) => 'width: 30px; height: 30px; border-radius: 8px; border: 2px solid #0E1511; display: flex; align-items: center; justify-content: center; font-size: 15px; background: ' + bg + '; color: ' + fg;
    const players = [
      { name: 'Peter (you)', shape: '●', tag: 'HOST', chipStyle: chip('#F04B3E', '#1E1A14'), nameColor: '#191919' },
      { name: 'Pat', shape: '▲', tag: '', chipStyle: chip('#2F7CF6', '#1E1A14'), nameColor: '#191919' },
      { name: 'Sam', shape: '■', tag: '', chipStyle: chip('#FFB81C', '#1E1A14'), nameColor: '#191919' },
      { name: 'Bot Billy', shape: '◆', tag: 'BOT', chipStyle: chip('#8BC53F', '#1E1A14'), nameColor: '#191919' },
      { name: 'Waiting for player…', shape: '', tag: '', chipStyle: chip('transparent', '#6B7280') + '; border-style: dashed; border-color: #6B7280', nameColor: '#6B7280' },
      { name: '+ Add bot', shape: '', tag: '', chipStyle: chip('transparent', '#6B7280') + '; border-style: dashed; border-color: #6B7280', nameColor: '#B07400' }
    ];
    const seg = (on) => 'height: 38px; min-width: 64px; padding: 0 14px; border: 0; border-radius: 999px; font-family: Nunito, sans-serif; font-weight: 800; font-size: 14px; cursor: pointer; background: ' + (on ? '#1E2A44' : 'transparent') + '; color: ' + (on ? '#FFFFFF' : '#191919');
    return {
      codeChars: 'K7QMX'.split('').map((ch) => ({ ch })),
      copyLabel: this.state.copied ? 'Link copied!' : 'Copy invite link',
      copy: () => this.setState({ copied: true }),
      players,
      modes: ['Classic', 'Frenzy'].map((label) => ({ label, style: seg(this.state.mode === label), pick: () => this.setState({ mode: label }) })),
      windows: ['3s', '5s', '8s'].map((label) => ({ label, style: seg(this.state.win === label), pick: () => this.setState({ win: label }) })),
      modeHint: this.state.mode === 'Classic' ? 'Classic: the auctioneer calls one color at a time. Best for 3–4.' : 'Frenzy: everyone bids any time; late bids add +3s. Best for 5–6.'
    };
  }
}
</script>
</body>
</html>
